name: Routing correctness oracle

on:
  push:
    branches: [trunk, 'test/**', 'feat/routing-*', 'fix/routing-*']
    paths:
      - 'tests/routing/**'
      - '.github/workflows/routing-oracle.yml'
  pull_request:
    paths:
      - 'tests/routing/**'
      - '.github/workflows/routing-oracle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  routing-oracle:
    name: Deterministic routing reference tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run reference oracle tests
        run: python3 -m unittest discover -s tests/routing -p 'test_*.py' -v
