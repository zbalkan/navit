name: Routing performance validation

on:
  push:
    branches: ['feat/routing-*']
    paths:
      - 'tests/routing/benchmark_production.inc'
      - 'tests/routing/test_benchmark.c'
      - 'tests/routing/validate_benchmark_csv.py'
      - 'tests/routing/production_hooks.h'
      - 'navit/route.c'
      - 'navit/route_turn_state.inc'
      - 'navit/route_turn_plan.inc'
      - 'navit/CMakeLists.txt'
      - '.github/workflows/routing-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: Synthetic full-search versus update cost
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm
    steps:
      - name: Install checkout tools
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@v4
      - name: Install build requirements
        run: |
          bash scripts/setup_common_requirements.sh
          apt-get install -y --no-install-recommends libpng-dev libfreetype6-dev libdbus-glib-1-dev libgtk2.0-dev cmake
      - name: Configure benchmark build
        run: cmake -S . -B build-routing -DCMAKE_BUILD_TYPE=Release -DNAVIT_ROUTING_TEST_HOOKS=ON -DSVG2PNG=OFF -DXPM2PNG=OFF -Dgraphics/qt_qpainter:BOOL=FALSE -Dgui/qml:BOOL=FALSE
      - name: Build benchmark executable
        run: cmake --build build-routing --target navit_routing_benchmark --parallel 2
      - name: Record benchmark environment
        shell: bash
        run: |
          {
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'runner=%s\n' "$RUNNER_NAME"
            printf 'os=%s\n' "$RUNNER_OS"
            uname -a
            grep -m1 'model name' /proc/cpuinfo || true
            grep -m1 'cpu MHz' /proc/cpuinfo || true
            cmake --version | head -n 1
            cc --version | head -n 1
            printf 'build_type=Release\n'
          } > routing-benchmark-environment.txt
      - name: Run correctness-gated benchmark
        shell: bash
        run: |
          set -o pipefail
          build-routing/navit/navit_routing_benchmark | tee routing-benchmark.csv
      - name: Validate benchmark CSV completeness
        run: python3 tests/routing/validate_benchmark_csv.py routing-benchmark.csv
      - name: Upload raw benchmark measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navit-routing-benchmark-csv
          path: |
            routing-benchmark.csv
            routing-benchmark-environment.txt
          if-no-files-found: warn
          retention-days: 30
